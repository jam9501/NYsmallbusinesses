<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NYC Zip Codes Explorer</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      width: 320px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #f3f3f3;
      cursor: pointer;
      position: sticky;
      top: 0;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }
  </style>
</head>

<body>

<h2>NYC ZIP Codes (Brooklyn, Queens, Manhattan)</h2>

<input type="text" id="search" placeholder="Search ZIP, County, Score..." />

<table id="table">
  <thead>
    <tr>
      <th onclick="sortTable(0)">Rank</th>
      <th onclick="sortTable(1)">ZIP Code</th>
      <th onclick="sortTable(2)">County</th>
      <th onclick="sortTable(3)">Overall Score</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
let data = [];

// 🔥 Load CSV directly from repo (NO upload needed)
fetch("NYZipCodes.csv")
  .then(res => res.text())
  .then(text => {

    const lines = text.split("\n");

    // remove title row
    const cleaned = lines.slice(1).join("\n");

    const parsed = Papa.parse(cleaned, {
      header: true,
      skipEmptyLines: true
    }).data;

    // filter BK / Queens / Manhattan
    data = parsed.filter(r =>
      ["Kings", "Queens", "New York"].includes(r.County)
    );

    render(data);
  });

// render table
function render(rows) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  rows.forEach(r => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.Rank || ""}</td>
      <td>${r["ZIP Code"] || ""}</td>
      <td>${r.County || ""}</td>
      <td>${r["Overall Score"] || ""}</td>
    `;

    tbody.appendChild(tr);
  });
}

// search
document.getElementById("search").addEventListener("input", function () {
  const q = this.value.toLowerCase();

  const filtered = data.filter(r =>
    Object.values(r).some(v =>
      String(v).toLowerCase().includes(q)
    )
  );

  render(filtered);
});

// sort
function sortTable(colIndex) {
  const keys = ["Rank", "ZIP Code", "County", "Overall Score"];
  const key = keys[colIndex];

  data.sort((a, b) =>
    (parseFloat(a[key]) || 0) - (parseFloat(b[key]) || 0)
  );

  render(data);
}
</script>

</body>
</html>
