<script>
let data = [];

// 🚀 robust GitHub Pages CSV loader
async function loadCSV() {
  try {
    const csvURL = new URL("NYZipCodes.csv", window.location.href);
    const res = await fetch(csvURL);

    if (!res.ok) {
      throw new Error("CSV not found: " + res.status);
    }

    const text = await res.text();

    // remove title row (your file issue)
    const lines = text.split("\n");
    const cleaned = lines.slice(1).join("\n");

    const parsed = Papa.parse(cleaned, {
      header: true,
      skipEmptyLines: true
    }).data;

    // filter BK / Queens / Manhattan
    data = parsed.filter(r =>
      ["Kings", "Queens", "New York"].includes(r.County)
    );

    render(data);

  } catch (err) {
    console.error("CSV load failed:", err);
    document.body.insertAdjacentHTML(
      "beforeend",
      "<p style='color:red'>CSV failed to load. Check file path in GitHub repo.</p>"
    );
  }
}

// render table
function render(rows) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  rows.forEach(r => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.Rank || ""}</td>
      <td>${r["ZIP Code"] || ""}</td>
      <td>${r.County || ""}</td>
      <td>${r["Overall Score"] || ""}</td>
    `;

    tbody.appendChild(tr);
  });
}

// search
document.getElementById("search").addEventListener("input", function () {
  const q = this.value.toLowerCase();

  const filtered = data.filter(r =>
    Object.values(r).some(v =>
      String(v).toLowerCase().includes(q)
    )
  );

  render(filtered);
});

// sort
function sortTable(colIndex) {
  const keys = ["Rank", "ZIP Code", "County", "Overall Score"];
  const key = keys[colIndex];

  data.sort((a, b) =>
    (parseFloat(a[key]) || 0) - (parseFloat(b[key]) || 0)
  );

  render(data);
}

// start loading immediately
loadCSV();
</script>
